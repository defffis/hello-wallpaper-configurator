<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Проверка адаптивности Hello</title><style>body{font:16px system-ui;margin:24px;background:#eee;color:#222}h1{font-size:22px}section{display:inline-block;vertical-align:top;margin:0 20px 24px 0}iframe{border:1px solid #bbb;height:820px;background:white}output{display:block;padding:8px 0}</style><h1>Проверка адаптивности</h1><p>Реальные экземпляры редактора при ширине 320, 390, 768 и 1280 px. Проверка не заменяет Safari на физическом iPhone.</p><div id="frames"></div><script>for(const width of [320,390,768,1280]){const section=document.createElement('section'),title=document.createElement('h2'),frame=document.createElement('iframe'),out=document.createElement('output');title.textContent=width+' px';frame.width=width;frame.title='Редактор '+width;frame.src='../index.html'+location.search;frame.addEventListener('load',()=>{const d=frame.contentDocument;setTimeout(()=>{const preview=d.querySelector('.preview').getBoundingClientRect(),controls=d.querySelector('.controls').getBoundingClientRect();out.textContent=(d.documentElement.scrollWidth<=width?'PASS':'FAIL')+' · без горизонтальной прокрутки · '+((width<=900?preview.top<controls.top:preview.left>controls.left)?'PASS':'FAIL');},100);});section.append(title,frame,out);document.getElementById('frames').append(section);}</script></html>
